name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 aapt / apksigner / zipalign / android.jar
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign android-sdk-platform-23

      - name: 下载 R8（d8）
        run: |
          curl -sL "https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.6.0-alpha15/r8-9.6.0-alpha15.jar" -o /tmp/r8.jar
          java -cp /tmp/r8.jar com.android.tools.r8.D8 --version

      - name: 构建
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bibibobo-tts-apk
          path: bibibobo-tts.apk
